<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PocketSmart AI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="nav">
  <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">PS</span><span>PocketSmart <span class="brand-ai">AI</span></span></a>
  <nav>
    {% if user %}
      <a href="/dashboard">Dashboard</a><a href="/home-planner">Home</a><a href="/party-planner">Party</a>
      <a href="/jewelry-planner">Jewelry</a><a href="/history">History</a>
      <a href="/logout">Logout ({{ user.username }})</a>
    {% else %}
      <a href="/login">Login</a><a class="btn" href="/register">Get started</a>
    {% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>PocketSmart AI · College project · Built with FastAPI + Gemini</footer>
</body>
</html>
